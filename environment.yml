name: maplehelper
channels:
  - conda-forge
dependencies:
  - python=3.14  # 3.15 had too many packages without builds (2026-10-24)
  - pytest
  # OCR benchmark (ocr_bench.py). The combo helper itself needs only the standard library.
  # onnxruntime comes from conda-forge for its CUDA build. The CUDA 13.4 build
  # runs on the GPU (needs an NVIDIA driver with CUDA 13.4+) and also on the CPU.
  - onnxruntime=1.31.*=*cuda134
  - numpy
  - pillow
  - pip
  - pip:
      - rapidocr>=3.10
      - mss>=10.2
      - opencv-python  # gamelab (in-game testing); rapidocr installs it too
