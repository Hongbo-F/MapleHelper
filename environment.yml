name: maplehelper
channels:
  - conda-forge
dependencies:
  - python=3.14  # 3.15 had too many packages without builds (2026-10-24)
  - pytest
  - pytest-xdist  # the tests on 8 workers (pyproject.toml)
  # OCR benchmark (ocr_bench.py). The combo helper itself needs only the standard library.
  # onnxruntime comes from conda-forge for its CUDA build. The CUDA 13.4 build
  # runs on the GPU (needs an NVIDIA driver with CUDA 13.4+) and also on the CPU.
  - onnxruntime=1.31.*=*cuda134
  - numpy
  # numpy's BLAS: OpenBLAS, not MKL. MKL 2026.2's default (Intel OpenMP) threading layer asked conda-forge's
  # llvm-openmp libiomp5md.dll for a function it doesn't have, and every numpy.linalg call killed the process
  # (0xC06D007F) on 3.15 and 3.14 alike; its SEQUENTIAL and TBB layers worked (2026-10-24).
  # One OpenBLAS thread (gamelab/__init__.py, maplehelper/__init__.py): with its default 24 a numpy import
  # commits about 3 GB.
  - libblas=*=*openblas
  - pillow
  - pip
  - pip:
      - rapidocr>=3.10
      - mss>=10.2
      - opencv-python  # gamelab (in-game testing); rapidocr installs it too
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.1+cu130
      - torchvision==0.29.1+cu130
      - ultralytics==8.4.187  # YOLO11n training
