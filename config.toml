# MapleHelper settings. Key names: a-z, 0-9, f1-f12, left/right/up/down, shift, ctrl, alt,
# space, enter, tab, esc, insert, delete, home, end, pageup, pagedown, ` - = [ ] \ ; ' , . /

# Hotkeys only work while the focused window's title contains this text.
# Run `python -m maplehelper --debug` and press a key in the game to see its exact title.
game_window_title = "MapleStory"

# Her in-game Key Config. Leave a skill as "" if she hasn't learned it yet.
[keys]
left = "left"
right = "right"
jump = "alt"
attack = "ctrl"
lucky_seven = "shift"   # "" -> stars are thrown with jump + attack instead
up = "up"           # climb
down = "down"       # climb down / lie down
pick_up = "z"
chair = "d"         # The Green Relaxer
sit = "x"
hp_potion = ""      # her pet drinks the potions now (since 2026-10-23); she only feeds it
mp_potion = ""
pet_food = "u"

# The button she presses for each combo. These keys are hidden from the game.
[hotkeys]
jump_throw = "f1"   # jump, then attack in mid-air so a star is thrown
back_off = "f2"     # walk away, turn around, throw twice
hop_back = "f3"     # a jump-back shot, then one more throw
jump_back_shot = "f4"  # jump away, turn around in the air, throw at the monster (star comes out as she lands)

[control]
abort = "esc"       # stops the running combo (Esc still reaches the game too)
slow_mode = "f12"   # toggles demo speed: pauses before each step so she can read the coach

# Milliseconds. Measured in game with her claw's regular attack: a jump is airborne ~530 ms, the star
# comes out ~530 ms after the attack key, and jump/attack presses before ~730 ms after it are ignored.
[timing]
key_press = 40
run_up = 100          # Jump-Back Shot: away arrow held this long before the jump (shorter: sometimes jumps straight up)
air_delay = 60        # away arrow kept held this long after the jump key, then she turns
turn_lead = 50        # turn arrow held this long before the attack and through it (a quick tap is sometimes ignored)
throw_gap = 750       # key_press + throw_gap must clear the ~730 ms attack lock; lower it only with a faster claw
turn_tap = 50         # turning around on the ground (Back Off)
walk_away = 500
buffer_window = 300   # combo button pressed in the last 300 ms of a running combo: runs right after it.
                      # Pressed earlier: ignored.
slow_pause = 900
recap = 3000

# Her stats, in % as the stat window shows them: how fast the game walks her (125 units/s x SPEED/100)
# and how high it jumps her (JUMP 100: 77 units). gamelab plans every move with them, so change them
# when gear or Haste does. 119.2 is measured (she walks 149 units/s); her stat window would say exactly.
# And her HP when full and her level: what a monster's touch takes is measured against them (where she
# stands, how near she lets monsters come), so change them when she levels up. Her MP when full and her
# Lucky Seven's level too: a throw is Lucky Seven only while she has MP for a cast (gamelab.attack.choice).
[character]
speed = 119.2
jump = 100
hp = 774            # (her HP bar's number at level 25, 2026-10-25)
level = 25
mp = 623            # her MP when full: what her MP bar's share is of (Lucky Seven only with MP for a cast)
lucky_seven = 16    # her Lucky Seven's skill level: its MP a cast in the game data (14 at 16 and 17: her bar fell
                    # 14.05 MP a cast live on 2026-10-25; 17 costs the same, her skill window tells)

# How gamelab captures the game: "dxgi" (desktop duplication: each frame as the screen shows it, about 2 ms
# for the game's window) or "mss" (a GDI copy that waits for the screen's next frame: 17 ms and more).
# DXGI falls back to mss by itself whenever it can't be used.
[capture]
method = "dxgi"
