<title>Autonomy Player Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a sticky top bar with search; a layer tree on the left (a drawer on phones); one view at a time on the right,
   high level first, every deeper part folded until opened. Each layer keeps one hue everywhere it appears. */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --sunk: #E8ECF1; --ink: #14202B; --muted: #566472; --faint: #8593A0;
  --line: #D4DBE3; --accent: #C2501B; --accent-ink: #FFFFFF; --focus: #2D6CB4; --mark: #FFE7A3;
  --l-runtime: #8A5A3B; --l-behavior: #7454C2; --l-attack: #C23C38; --l-control: #A86E12; --l-motion: #2C8A57;
  --l-localization: #2D6CB4; --l-perception: #17868A; --l-sim: #AE4A84; --l-analysis: #6F7522; --l-ui: #5464A6;
  --l-tests: #5B7B56; --l-shared: #66717C; --l-foundation: #446878;
  --font-display: "Space Grotesk", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --font-text: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
  --r: 8px; --side: 290px; --bar: 56px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1318; --surface: #151C23; --sunk: #1B242D; --ink: #E3E9EF; --muted: #9AA8B5; --faint: #6D7B88;
  --line: #27323C; --accent: #F0844A; --accent-ink: #1A0E06; --focus: #6EA6EA; --mark: #5A4710;
  --l-runtime: #CC9873; --l-behavior: #A68AEB; --l-attack: #EE7B73; --l-control: #E0AA52; --l-motion: #5CC48A;
  --l-localization: #6EA6EA; --l-perception: #4CC2C0; --l-sim: #E087BC; --l-analysis: #B9BF59; --l-ui: #929FE2;
  --l-tests: #9CC296; --l-shared: #A3ADB7; --l-foundation: #8DB2C4; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1318; --surface: #151C23; --sunk: #1B242D; --ink: #E3E9EF; --muted: #9AA8B5; --faint: #6D7B88;
  --line: #27323C; --accent: #F0844A; --accent-ink: #1A0E06; --focus: #6EA6EA; --mark: #5A4710;
  --l-runtime: #CC9873; --l-behavior: #A68AEB; --l-attack: #EE7B73; --l-control: #E0AA52; --l-motion: #5CC48A;
  --l-localization: #6EA6EA; --l-perception: #4CC2C0; --l-sim: #E087BC; --l-analysis: #B9BF59; --l-ui: #929FE2;
  --l-tests: #9CC296; --l-shared: #A3ADB7; --l-foundation: #8DB2C4; color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar) + 16px); }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-text); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--focus); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 700; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
h4 { font-size: 14px; font-weight: 600; }
code, pre, .mono { font-family: var(--font-mono); font-size: 12.5px; }
code { background: var(--sunk); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre { background: var(--sunk); padding: 12px 14px; border-radius: var(--r); overflow-x: auto; line-height: 1.5; }
pre code { background: none; padding: 0; overflow-wrap: normal; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font: 600 11px/1.2 var(--font-text); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; color: inherit; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px; height: var(--bar); }
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; color: var(--ink); }
.brand b { font: 700 17px var(--font-display); }
.brand span { color: var(--muted); font-size: 12px; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav a { padding: 6px 10px; border-radius: 6px; color: var(--muted); font-weight: 500; font-size: 14px; white-space: nowrap; }
.nav a:hover { background: var(--sunk); text-decoration: none; color: var(--ink); }
.nav a.on { color: var(--ink); background: var(--sunk); }
.search { position: relative; margin-left: auto; flex: 0 1 300px; min-width: 120px; }
.search input { width: 100%; height: 34px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 0 10px 0 30px; font: inherit; font-size: 14px; }
.search svg { position: absolute; left: 9px; top: 9px; color: var(--faint); }
.results { position: absolute; right: 0; top: 40px; width: min(520px, calc(100vw - 32px)); max-height: 70vh; overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(10,20,30,.18); padding: 6px; }
.results a { display: block; padding: 7px 9px; border-radius: 6px; color: var(--ink); }
.results a:hover, .results a.sel { background: var(--sunk); text-decoration: none; }
.results .t { display: flex; gap: 8px; align-items: baseline; }
.results .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; min-width: 62px; }
.results .s { font-size: 12.5px; color: var(--muted); padding-left: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 34px; padding: 0 10px; cursor: pointer; }

/* shell */
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); gap: 28px; align-items: start; }
.side { position: sticky; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); max-height: calc(100vh - var(--bar)); overflow: auto;
  padding-block: 16px 40px; font-size: 13.5px; scrollbar-width: thin; }
.side details { margin: 0; }
.side summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; font-weight: 600; }
.side summary::-webkit-details-marker { display: none; }
.side summary:hover { background: var(--sunk); }
.side .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.side .n { margin-left: auto; color: var(--faint); font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
.side ul { list-style: none; margin: 2px 0 8px; padding: 0 0 0 17px; border-left: 1px solid var(--line); margin-left: 10px; }
.side li a { display: block; padding: 3px 8px; border-radius: 5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side li a:hover { background: var(--sunk); color: var(--ink); text-decoration: none; }
.side li a.on { color: var(--ink); background: var(--sunk); font-weight: 600; }
.side .grp { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; padding: 8px 8px 2px; }
main { padding-block: 22px 120px; min-width: 0; }
.wrap { max-width: 920px; }
.wrap.wide { max-width: 1240px; }
.prose { max-width: 72ch; }
.prose p { margin: 0 0 .8em; }
.prose ul, .prose ol { margin: 0 0 .8em; padding-left: 1.3em; }
.prose li { margin: .15em 0; }
.prose table, table.t { border-collapse: collapse; font-size: 13.5px; margin: 0 0 1em; }
.prose th, .prose td, table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 6px 10px 6px 0; text-align: left; vertical-align: top; }
.prose th, table.t th { font-weight: 600; font-size: 12px; color: var(--muted); }
.tbl { overflow-x: auto; max-width: 100%; }
.stack-gap { display: grid; gap: 26px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; }
a.chip:hover { text-decoration: none; border-color: var(--focus); }
.chip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; font-style: normal; }
.chip.lazy { border-style: dashed; color: var(--muted); }
.tag { font: 600 10.5px/1 var(--font-text); letter-spacing: .05em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px;
  background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.warn { background: color-mix(in srgb, var(--l-attack) 16%, var(--surface)); color: var(--l-attack); }
.tag.ok { background: color-mix(in srgb, var(--l-motion) 16%, var(--surface)); color: var(--l-motion); }

/* headers */
.crumbs { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.crumbs a { color: var(--muted); }
.head { display: grid; gap: 8px; margin-bottom: 22px; }
.tagline { font-size: 17px; color: var(--muted); margin: 0; }
.lede { font-size: 16px; max-width: 72ch; margin: 0; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }

/* folds */
details.fold { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.fold + details.fold { margin-top: 8px; }
details.fold > summary { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: ""; flex: none; width: 7px; height: 7px; margin-top: 7px; border-right: 2px solid var(--faint);
  border-bottom: 2px solid var(--faint); transform: rotate(-45deg); transition: transform .15s; }
details.fold[open] > summary::before { transform: rotate(45deg); margin-top: 5px; }
details.fold > summary:hover { background: var(--sunk); border-radius: var(--r); }
details.fold > .body { padding: 2px 16px 16px 31px; display: grid; gap: 14px; min-width: 0; }
.sum-main { min-width: 0; flex: 1; display: grid; gap: 2px; }
.sum-title { font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.sum-sub { color: var(--muted); font-size: 13.5px; }
.sum-meta { color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
details.plain > summary { list-style: none; cursor: pointer; color: var(--focus); font-weight: 500; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
details.plain > summary::-webkit-details-marker { display: none; }
details.plain > summary::after { content: "+"; font-weight: 600; }
details.plain[open] > summary::after { content: "−"; }
details.plain > .body { margin-top: 10px; }

/* section */
.sec { display: grid; gap: 12px; }
.sec > .sec-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.slice { border-top: 3px solid var(--lc, var(--line)); padding-top: 18px; display: grid; gap: 14px; }
.group-h { display: grid; gap: 2px; margin: 10px 0 4px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 28px; }
.kv > div { min-width: 0; }
.kv ul { margin: 4px 0 0; padding-left: 1.1em; }
.kv li { margin: 2px 0; }

/* key items */
.items { display: grid; gap: 6px; }
.item { border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.item > summary { list-style: none; cursor: pointer; padding: 8px 12px; display: grid; gap: 2px; }
.item > summary::-webkit-details-marker { display: none; }
.item > summary:hover { background: var(--sunk); border-radius: 7px; }
.item .nm { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.item .nm .ln { color: var(--faint); font-weight: 400; font-size: 12px; }
.item .ds { font-size: 13.5px; color: var(--muted); }
.item > .body { padding: 0 12px 12px; display: grid; gap: 8px; }
.item.target { outline: 2px solid var(--accent); }

/* stack diagram */
.stack { width: 100%; height: auto; display: block; }
.stack .box { transition: opacity .15s; }
.stack .box { cursor: pointer; }
.stack .box text { pointer-events: none; }
.stack.hovering .box { opacity: .28; }
.stack.hovering .box.hot, .stack.hovering .box.dep { opacity: 1; }
.stack .box.dep rect { stroke-dasharray: 5 3; }
.stack .box.cur rect { stroke-width: 3px !important; }
.caption { min-height: 46px; font-size: 13.5px; color: var(--muted); padding: 8px 0 0; }
.caption b { color: var(--ink); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { display: grid; gap: 6px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; color: var(--ink); min-width: 0; }
a.card:hover { text-decoration: none; border-color: var(--focus); }
.card .ct { font-weight: 600; }
.card .cs { font-size: 13.5px; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; color: var(--muted); }
.stats b { color: var(--ink); font: 600 18px var(--font-display); margin-right: 4px; font-variant-numeric: tabular-nums; }

/* flows */
.flow { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: st; }
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; cursor: pointer; padding: 10px 10px 10px 0; border-radius: 8px; position: relative; }
.step::before { counter-increment: st; content: counter(st); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font: 600 12.5px var(--font-display); background: var(--surface); border: 2px solid var(--sc, var(--line)); color: var(--ink); z-index: 1; font-variant-numeric: tabular-nums; }
.step:not(:last-child)::after { content: ""; position: absolute; left: 13px; top: 38px; bottom: -10px; width: 2px; background: var(--line); }
.step:hover { background: color-mix(in srgb, var(--sunk) 60%, transparent); }
.step.on { background: var(--sunk); }
.step.on::before { background: var(--sc); color: var(--surface); }
.step .where { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-size: 13px; }
.step .txt { margin-top: 3px; }
.step .more { margin-top: 8px; font-size: 13.5px; color: var(--muted); display: none; }
.step.on .more { display: block; }
.flow-side { position: sticky; top: calc(var(--bar) + 20px); display: grid; gap: 10px; }
.ctrl { display: flex; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 11px; cursor: pointer; font-size: 13.5px; }
.btn:hover { border-color: var(--focus); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.filter { height: 34px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 0 10px; font: inherit; font-size: 14px; width: min(360px, 100%); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.timeline .d { font: 500 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
dl.gloss { margin: 0; display: grid; gap: 0; }
dl.gloss > div { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
dl.gloss dt { font-weight: 600; }
dl.gloss dd { margin: 0; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.empty { color: var(--muted); font-style: italic; }
.scrim { display: none; }
.deploy { display: grid; gap: 14px; }
.lane { display: grid; gap: 8px; }
.lane-h { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.lane-b { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 10px; }
.pbox { display: grid; gap: 7px; align-content: start; background: var(--surface); border: 1.5px solid var(--focus); border-radius: 10px; padding: 12px 14px; color: var(--ink); min-width: 0; }
a.pbox:hover { text-decoration: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.pbox.adm { border-color: var(--l-attack); }
.pbox.out { border-style: dashed; border-color: var(--faint); background: var(--sunk); }
.pbox-n { font: 600 15.5px var(--font-display); }
.pbox-c { font-size: 11.5px; justify-self: start; }
.pbox-in, ul.inside { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.pbox-in li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.pbox-in .rk { min-width: 0; margin: 0; }
ul.inside { gap: 10px; font-size: 14px; }
.rk { display: inline-block; min-width: 92px; margin-right: 8px; font: 600 10.5px/1.6 var(--font-text); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.sheet { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 16px 18px; display: grid; gap: 10px; }
.sheet + .sheet { margin-top: 12px; }
.sheet-h { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.sheet-h h3 { font-size: 19px; }
dl.facts { margin: 0; display: grid; gap: 0; }
dl.facts > div { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); }
dl.facts dt { font-weight: 600; font-size: 13.5px; color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; }
dl.facts ul { margin: 0; padding-left: 1.1em; }
dl.facts ul.inside { padding-left: 0; }
.ans-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
.card.ans { align-content: start; }
.card.ans .ct { font: 600 16px var(--font-display); }
.card.ans .cs p { margin: 0 0 .4em; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--pc, var(--focus)); }
.pill.on { border-color: var(--pc, var(--focus)); background: color-mix(in srgb, var(--pc, var(--focus)) 14%, var(--surface)); font-weight: 600; }
svg.sys { width: 100%; min-width: 760px; height: auto; display: block; }
.sys-node { cursor: pointer; transition: opacity .15s; }
.sys-node:hover rect { stroke-width: 2.6px !important; }
.sys-node.dim { opacity: .45; }
.sys-edge { transition: opacity .15s; }
.sys-edge.dim { opacity: .12; }
.sys-edge.off { opacity: .07; }
.sys-card { display: grid; gap: 12px; }
.tag.read { color: var(--l-perception); background: color-mix(in srgb, var(--l-perception) 14%, var(--surface)); }
ul.tree, ul.tree ul { list-style: none; margin: 0; padding: 0; }
ul.tree ul { padding-left: 22px; border-left: 1px solid var(--line); margin: 4px 0 4px 8px; }
ul.tree li { padding: 4px 0; }
.seq2 { position: relative; }
.sq-head { display: grid; gap: 14px; position: sticky; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--bg); padding: 6px 0 8px; border-bottom: 1px solid var(--line); }
.sq-parts { position: relative; height: 42px; }
.sq-p { position: absolute; top: 0; height: 40px; display: grid; place-items: center; text-align: center; font: 600 11px/1.12 var(--font-display); padding: 2px 3px;
  border: 1.4px solid var(--focus); border-radius: 7px; background: var(--surface); overflow: hidden; }
.sq-p.adm { border-color: var(--l-attack); }
.sq-p.out { border-style: dashed; border-color: var(--faint); background: var(--sunk); }
.sq-what { align-self: end; }
ol.sq-rows { list-style: none; margin: 0; padding: 0; }
.sq-row { display: grid; gap: 14px; cursor: pointer; border-radius: 8px; }
.sq-row:hover { background: color-mix(in srgb, var(--sunk) 55%, transparent); }
.sq-row.on { background: var(--sunk); }
.sq-row.on .sq-txt { font-weight: 500; }
.sq-lanes { position: relative; min-height: 100%; }
.sq-lanes .life { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.2px dashed var(--line); }
.sq-lanes svg { position: relative; display: block; margin-top: 4px; }

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("arch-data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => String(s).replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const fmt = n => Number(n || 0).toLocaleString("en-US");
const kfmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);

const MOD = D.modules;
const LAYER = Object.fromEntries(D.layers.map(l => [l.id, l]));
const SLICE = Object.fromEntries(D.slices.map(s => [s.id, s]));
const lc = id => `var(--l-${LAYER[id] ? id : "shared"})`;
const modHref = (p, item) => "#m-" + slug(p) + (item ? "--" + slug(item) : "");
const ROUTE_MOD = {}; for (const p in MOD) ROUTE_MOD["m-" + slug(p)] = p;
const UNMAPPED = Object.fromEntries((D.unmapped || []).map(u => [u.path, u]));
for (const p in UNMAPPED) ROUTE_MOD["m-" + slug(p)] = p;
const slicesOf = layer => D.slices.filter(s => s.layer === layer);
const modTitle = p => MOD[p] ? MOD[p].title : p.replace(/^gamelab\//, "");
const layerOfPath = p => (MOD[p] && MOD[p].layer) || (UNMAPPED[p] && UNMAPPED[p].layer) || "shared";

/* ---------- markdown, with code spans that name a module or class turned into links ---------- */
let mdr = null;
try {
  if (window.marked && window.marked.Marked) {
    mdr = new window.marked.Marked({ gfm: true, breaks: false });
    mdr.use({ renderer: { html(x) { return esc(typeof x === "string" ? x : (x && (x.text || x.raw)) || ""); } } });
  }
} catch (e) { mdr = null; }
function md(s) {
  if (!s) return "";
  if (mdr) { try { return mdr.parse(String(s)); } catch (e) { /* fall through */ } }
  return String(s).split(/\n{2,}/).map(p => "<p>" + esc(p).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>") + "</p>").join("");
}
// Index: names a code span might use -> [module path, item name]
const NAME = new Map();
function addName(key, val) { if (!key) return; const k = key.toLowerCase(); if (!NAME.has(k)) NAME.set(k, []); const arr = NAME.get(k); if (!arr.some(v => v[0] === val[0] && v[1] === val[1])) arr.push(val); }
const allPaths = [...Object.keys(MOD), ...Object.keys(UNMAPPED)];
for (const p of allPaths) {
  addName(p, [p, ""]);
  const noPkg = p.replace(/^gamelab\//, "");
  addName(noPkg, [p, ""]);
  const dotted = p.replace(/\.py$/, "").replace(/\/__init__$/, "").replace(/\//g, ".");
  addName(dotted, [p, ""]); addName(dotted.replace(/^gamelab\./, ""), [p, ""]);
}
const BASE = new Map(); // "retreat" -> [paths]
for (const p of allPaths) { const b = p.split("/").pop().replace(/\.py$/, ""); if (b === "__init__") continue; if (!BASE.has(b)) BASE.set(b, []); BASE.get(b).push(p); }
for (const [p, m] of Object.entries(MOD)) {
  for (const it of m.key_items || []) {
    addName(it.name, [p, it.name]);
    const b = p.split("/").pop().replace(/\.py$/, "");
    addName(b + "." + it.name, [p, it.name]);
    if (it.name.includes(".")) addName(it.name.split(".")[0], [p, it.name.split(".")[0]]);
  }
}
function lookup(text) {
  let t = text.trim().replace(/\(\)$/, "").replace(/\(.*\)$/, "").replace(/:\d+$/, "");
  if (!t || t.length < 3 || /\s/.test(t)) return null;
  let hit = NAME.get(t.toLowerCase());
  if (hit && hit.length === 1) return hit[0];
  if (hit && hit.length > 1) { const cls = hit.filter(h => MOD[h[0]] && (MOD[h[0]].key_items || []).some(i => i.name === h[1] && (i.kind === "class" || i.kind === "dataclass"))); if (cls.length === 1) return cls[0]; return null; }
  const parts = t.split(".");
  if (parts.length >= 2) { // module.symbol, as the README writes it
    const ps = BASE.get(parts[0]);
    if (ps && ps.length === 1) { const p = ps[0]; const rest = parts.slice(1).join("."); const m = MOD[p]; const item = m && (m.key_items || []).find(i => i.name === rest || i.name.endsWith("." + rest)); return [p, item ? item.name : ""]; }
  }
  if (BASE.has(t) && BASE.get(t).length === 1 && t.length > 3) return [BASE.get(t)[0], ""];
  return null;
}
function enhance(root) {
  for (const c of $$("code", root)) {
    if (c.closest("pre") || c.closest("a")) continue;
    const hit = lookup(c.textContent);
    if (!hit) continue;
    const a = document.createElement("a"); a.href = modHref(hit[0], hit[1]); a.title = hit[0] + (hit[1] ? " · " + hit[1] : "");
    c.replaceWith(a); a.appendChild(c);
  }
  for (const t of $$("table", root)) { if (!t.parentElement.classList.contains("tbl")) { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); } }
}

/* ---------- small renderers ---------- */
const chipMod = (p, lazy) => `<a class="chip${lazy ? " lazy" : ""}" href="${modHref(p)}" title="${esc(p)}${lazy ? " (imported inside a function)" : ""}"><i style="background:${lc(layerOfPath(p))}"></i>${esc(modTitle(p))}</a>`;
const layerChip = id => `<a class="chip" href="#layer-${id}"><i style="background:${lc(id)}"></i>${esc(LAYER[id] ? LAYER[id].title : id)}</a>`;
const list = (arr, f = x => md(x)) => arr && arr.length ? "<ul>" + arr.map(x => "<li>" + f(x).replace(/^<p>|<\/p>\s*$/g, "") + "</li>").join("") + "</ul>" : "";
const loc = (p, line) => `<span class="mono muted small" title="${esc(p)}${line ? ":" + line : ""}">${esc(p)}${line ? ":" + line : ""}</span>`;

function fold(summaryHtml, bodyHtml, { open = false, id = "", cls = "fold" } = {}) {
  return `<details class="${cls}"${open ? " open" : ""}${id ? ` id="${id}"` : ""}><summary>${summaryHtml}</summary><div class="body">${bodyHtml}</div></details>`;
}
function itemHtml(p, it, open) {
  const deep = it.details_md ? `<div class="prose">${md(it.details_md)}</div>` : "";
  const sig = it.signature ? `<pre><code>${esc(it.signature)}</code></pre>` : "";
  return `<details class="item" id="k-${slug(it.name)}"${open ? " open" : ""}><summary>
    <div class="nm">${esc(it.name)} <span class="tag">${esc(it.kind || "")}</span>${it.line ? `<span class="ln">line ${it.line}</span>` : ""}</div>
    <div class="ds">${esc(it.summary || "")}</div></summary>${sig || deep ? `<div class="body">${sig}${deep}</div>` : ""}</details>`;
}
function tableHtml(head, rows) {
  if (!rows.length) return "";
  return `<div class="tbl"><table class="t"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function moduleSummaryRow(p) {
  const m = MOD[p];
  if (!m) { const u = UNMAPPED[p]; return `<div class="card"><a href="${modHref(p)}">${esc(p)}</a><span class="cs">${u ? u.lines + " lines, not described yet" : ""}</span></div>`; }
  const body = `<div class="prose">${md(m.summary)}</div>
    ${(m.key_items || []).length ? `<div><div class="eyebrow">Key pieces</div><div class="items" style="margin-top:6px">${(m.key_items || []).slice(0, 6).map(it => itemHtml(p, it)).join("")}</div></div>` : ""}
    <div><a href="${modHref(p)}">Everything about ${esc(m.title)} →</a></div>`;
  return fold(`<div class="sum-main"><div class="sum-title">${esc(m.title)} <span class="mono muted small">${esc(p.replace(/^gamelab\//, ""))}</span></div><div class="sum-sub">${esc(m.tagline)}</div></div><span class="sum-meta">${fmt(m.code.lines)} lines</span>`, body, { id: "f-" + slug(p) });
}

/* ---------- the layer stack ---------- */
const STACK = {
  W: 960, H: 528, boxes: {
    runtime: [0, 0, 960, 56],
    behavior: [0, 72, 624, 56], attack: [0, 136, 304, 56], control: [320, 136, 304, 56],
    motion: [0, 200, 624, 56], localization: [0, 264, 624, 56], perception: [0, 328, 624, 56],
    sim: [656, 72, 304, 120], analysis: [656, 200, 304, 56], ui: [656, 264, 304, 56], tests: [656, 328, 304, 56],
    shared: [0, 400, 960, 56], foundation: [0, 472, 960, 56],
  }
};
const STACK_NARROW = {
  W: 420, H: 556, boxes: {
    runtime: [0, 0, 420, 46], behavior: [0, 62, 420, 46], attack: [0, 116, 206, 46], control: [214, 116, 206, 46],
    motion: [0, 170, 420, 46], localization: [0, 224, 420, 46], perception: [0, 278, 420, 46],
    sim: [0, 340, 206, 46], analysis: [214, 340, 206, 46], ui: [0, 394, 206, 46], tests: [214, 394, 206, 46],
    shared: [0, 456, 420, 46], foundation: [0, 510, 420, 46],

};
function stackSvg({ mini = false, current = "" } = {}) {
  const narrow = !mini && window.innerWidth < 640;
  const { W, H, boxes } = narrow ? STACK_NARROW : STACK;
  const g = Object.entries(boxes).map(([id, [x, y, w, h]]) => {
    const L = LAYER[id] || { title: id, blurb: "", stats: {} };
    const st = L.stats || {};
    const per = Math.floor((w - 28) / 6.6), rows = Math.max(1, Math.floor((h - 26) / 16));
    const tl = mini || narrow ? "" : wrapLines(L.blurb, per, rows).map((ln, i) => `<text x="${x + 14}" y="${y + 40 + i * 16}" style="font:12.5px var(--font-text);fill:var(--muted)">${esc(ln)}</text>`).join("");
    const meta = mini ? "" : narrow ? `<text x="${x + 12}" y="${y + 36}" style="font:11px var(--font-text);fill:var(--faint)">${st.files || 0} files · ${kfmt(st.lines || 0)} lines</text>` : `<text x="${x + w - 12}" y="${y + 21}" text-anchor="end" style="font:11.5px var(--font-text);fill:var(--faint)">${st.files || 0} files · ${kfmt(st.lines || 0)} lines</text>`;
    return `<g class="box${id === current ? " cur" : ""}" data-layer="${id}" tabindex="0" role="link" aria-label="${esc(L.title)}">
      <rect x="${x + 1}" y="${y + 1}" width="${w - 2}" height="${h - 2}" rx="8" style="fill:color-mix(in srgb, ${lc(id)} 13%, var(--surface));stroke:${lc(id)};stroke-width:1.5px"/>
      <text x="${x + (narrow ? 12 : 14)}" y="${y + (mini ? h / 2 + 6 : narrow ? 20 : 22)}" style="font:600 ${mini ? 17 : narrow ? 15 : 14.5}px var(--font-display);fill:var(--ink)">${esc(L.title)}</text>${tl}${meta}</g>`;
  }).join("");

function wrapLines(s, per, rows) {
  const words = String(s || "").split(/\s+/), out = [""];
  for (const w of words) { const cur = out[out.length - 1]; if ((cur + " " + w).trim().length <= per) out[out.length - 1] = (cur + " " + w).trim(); else out.push(w); }
  if (out.length > rows) { out.length = rows; out[rows - 1] = trimTo(out[rows - 1] + " …", per); }

}
function trimTo(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s; }
function wireStack(svg, caption) {
  const edges = D.layer_edges || [];
  const show = id => {
    const L = LAYER[id]; if (!L) return;
    svg.classList.add("hovering");
    const deps = new Set(L.allowed || []);
    const actual = edges.filter(e => e.from === id).sort((a, b) => b.count - a.count);
    for (const b of $$(".box", svg)) { b.classList.toggle("hot", b.dataset.layer === id); b.classList.toggle("dep", deps.has(b.dataset.layer)); }
    if (caption) {
      const rule = L.allowed ? (L.allowed.length ? `may import <b>${L.allowed.map(a => LAYER[a] ? LAYER[a].title : a).join(", ")}</b> and Shared (dashed), and nothing above it` : "may import only Shared: nothing of the map, motion or fighting") : "not one of the checked layers";
      const real = actual.length ? ` · in the code: ${actual.slice(0, 6).map(e => `${LAYER[e.to] ? LAYER[e.to].title : e.to} ×${e.count}`).join(", ")}` : "";
      caption.innerHTML = `<b>${esc(L.title)}</b>: ${esc(L.blurb)}.<br>${rule}${real}`;
    }
  };

  for (const b of $$(".box", svg)) {
    b.addEventListener("mouseenter", () => show(b.dataset.layer));
    b.addEventListener("focus", () => show(b.dataset.layer));
    b.addEventListener("mouseleave", clear); b.addEventListener("blur", clear);
    b.addEventListener("click", () => { location.hash = "layer-" + b.dataset.layer; });
    b.addEventListener("keydown", e => { if (e.key === "Enter") location.hash = "layer-" + b.dataset.layer; });

  if (caption) caption.innerHTML = caption.dataset.idle || "";
}

/* ---------- sidebar ---------- */
function renderSide() {
  const html = D.layers.map(L => {
    const sl = slicesOf(L.id);
    if (!sl.length) return "";
    const n = sl.reduce((a, s) => a + (s.module_paths || []).length, 0);
    const inner = sl.map(s => `<li class="grp">${esc(shortSlice(s))}</li>` + (s.module_paths || []).map(p => `<li><a href="${modHref(p)}" data-path="${esc(p)}" title="${esc(p)}">${esc(modTitle(p))}</a></li>`).join("")).join("");
    return `<details data-layer="${L.id}"><summary><span class="dot" style="background:${lc(L.id)}"></span><a href="#layer-${L.id}" style="color:inherit">${esc(L.title)}</a><span class="n">${n}</span></summary><ul>${inner}</ul></details>`;
  }).join("");
  $("#side").innerHTML = `<div class="eyebrow" style="padding:0 6px 8px">Layers, top to bottom</div>${html}`;
}
function shortSlice(s) { const t = s.title || s.id; const i = t.indexOf(":"); return i > 0 ? t.slice(i + 1).trim() : t; }
function markSide(path, layer) {
  for (const a of $$(".side li a")) a.classList.toggle("on", a.dataset.path === path);
  if (layer) { const d = $(`.side details[data-layer="${layer}"]`); if (d) d.open = true; }
  const on = $(".side li a.on"); if (on) on.scrollIntoView({ block: "nearest" });
  for (const a of $$("#nav a")) a.classList.toggle("on", location.hash && a.getAttribute("href") === "#" + currentView);
}

/* ---------- views ---------- */
let currentView = "overview";
function viewLayersOverview() {
  const t = D.totals;
  const flows = D.flows || [];
  const firstFlows = flows.slice(0, 6);
  return `<div class="stack-gap">
  <div class="head"><div class="crumbs"><a href="#overview">System</a><span>›</span><span>Code</span></div><h1>How the code is organised</h1><p class="tagline">The packages, the layers they form, and what each may import.</p>
    <div class="stats"><span><b>${fmt(t.files)}</b>source files</span><span><b>${kfmt(t.lines)}</b>lines</span><span><b>${D.slices.length}</b>slices described</span><span><b>${(D.flows || []).length}</b>end-to-end flows</span><span><b>${(D.glossary || []).length}</b>glossary terms</span></div></div>
  ${D.overview_md ? `<div class="prose">${md(D.overview_md)}</div>` : ""}
  <section class="sec"><div class="sec-h"><h2>The layers</h2><span class="muted small">hover a layer to see what it may import; click to open it</span></div>
    <div class="panel"><div id="stack-host">${stackSvg()}</div><div class="caption" id="stack-cap" data-idle="Like a self-driving car's stack: each layer only imports the layers below it, and <code>tests/test_architecture.py</code> fails the build if one doesn't. The side column is offline: the simulator, analysis, the UI and the tests."></div></div>
  </section>

  ${(D.processes || []).length ? `<section class="sec"><div class="sec-h"><h2>What runs</h2><a href="#runtime" class="small">processes, files and commands →</a></div>
    <div class="cards">${D.processes.map(p => `<a class="card" href="#runtime--p-${slug(p.id)}"><div class="row"><span class="ct">${esc(p.name)}</span>${p.elevated ? `<span class="tag warn">admin</span>` : ""}</div><div class="cs">${esc(trimTo(p.summary, 170))}</div></a>`).join("")}</div></section>` : ""}
  <section class="sec"><div class="sec-h"><h2>Every slice</h2></div>
    <div class="cards">${D.slices.map(s => `<a class="card" href="#slice-${slug(s.id)}" style="border-top:3px solid ${lc(s.layer)}"><span class="ct">${esc(s.title)}</span><span class="cs">${esc(s.tagline)}</span><span class="sum-meta">${(s.module_paths || []).length} modules</span></a>`).join("")}</div></section>
  <p class="muted small">Built ${esc(D.generated)} from commit ${esc(D.commit)} (${esc(D.commit_date)}). Imports, importers and line counts are read from the code at build time; the prose was written from the code and <code>gamelab/README.md</code> and checked against the code.${(D.unmapped || []).length ? ` ${D.unmapped.length} files have no description yet.` : ""}</p>
  </div>`;
}
function flowCard(f) {
  const ls = [...new Set((f.steps || []).map(s => layerOfPath(s.module)))];
  return `<a class="card" href="#flow-${slug(f.id)}"><span class="ct">${esc(f.title)}</span><span class="cs">${esc(trimTo(f.summary, 180))}</span>
    <span class="row">${ls.map(l => `<span class="swatch" title="${esc(LAYER[l] ? LAYER[l].title : l)}" style="background:${lc(l)};margin:0"></span>`).join("")}<span class="sum-meta">${(f.steps || []).length} steps</span></span></a>`;
}

function viewLayer(id) {
  const L = LAYER[id]; if (!L) return notFound();
  const sl = slicesOf(id);
  const rule = L.allowed ? (L.allowed.length ? `May import ${L.allowed.map(layerChip).join(" ")} and Shared.` : "May import only Shared.") : "";
  const real = (D.layer_edges || []).filter(e => e.from === id).sort((a, b) => b.count - a.count);
  const usedBy = (D.layer_edges || []).filter(e => e.to === id).sort((a, b) => b.count - a.count);

function wireFlow() {

    const layer = steps[cur].dataset.layer;

    $("#flow-pos").textContent = `Step ${cur + 1} of ${steps.length} · ${LAYER[layer] ? LAYER[layer].title : layer}`;

  const stop = () => { if (player) { clearInterval(player); player = null; } playBtn.textContent = "Play"; };
  playBtn.addEventListener("click", () => {
    if (player) return stop();
    if (cur >= steps.length - 1) cur = -1;

  $('[data-act="prev"]').addEventListener("click", () => { stop(); set(cur - 1); });

}

function procName(id) { const p = (D.processes || []).find(x => x.id === id); return p ? p.name : id; }
function procGraph(P) {
  // A ring of processes; an edge for every "talks to". Elevated ones are drawn with the warning colour.
  const n = P.length; if (n < 2) return "";
  const W = 760, H = 420, cx = W / 2, cy = H / 2 + 6, rx = 290, ry = 160;
  const pos = Object.fromEntries(P.map((p, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [p.id, [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]]; }));
  const edges = []; const seen = new Set();
  for (const p of P) for (const t of p.talks_to || []) { if (!pos[t.process]) continue; const k = [p.id, t.process].sort().join("|"); if (seen.has(k)) continue; seen.add(k); edges.push([p.id, t.process, t.via || ""]); }
  const lines = edges.map(([a, b]) => `<line x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}" style="stroke:var(--line);stroke-width:1.6px"/>`).join("");
  const nodes = P.map(p => { const [x, y] = pos[p.id]; const w = Math.min(200, 26 + p.name.length * 7.2); return `<a href="#runtime--p-${slug(p.id)}"><g><rect x="${x - w / 2}" y="${y - 17}" width="${w}" height="34" rx="17" style="fill:var(--surface);stroke:${p.elevated ? "var(--l-attack)" : "var(--focus)"};stroke-width:1.6px"/><text x="${x}" y="${y + 4.5}" text-anchor="middle" style="font:600 12.5px var(--font-text);fill:var(--ink)">${esc(trimTo(p.name, 26))}</text></g></a>`; }).join("");
  return `<div class="panel tbl"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px;height:auto;display:block" role="img" aria-label="Processes and who talks to whom">${lines}${nodes}</svg><div class="small muted">A line joins two processes that talk; red outline: runs as administrator. Open one below for how.</div></div>`;
}

function seqHtml(s) {

function wireScenario() {

  const [base, sub] = raw.split("--");
  let html, path = "", layer = "", after = null;
  currentView = base;
  if (base === "overview") { html = viewSystem(sub); after = () => wireSystem($("#main"), sub); }
  else if (base === "layers") html = viewLayersOverview();
  else if (base === "scenarios") html = viewScenarios("");
  else if (base.startsWith("scenario-")) { html = viewScenarios(base.slice(9)); currentView = "scenarios"; after = wireScenario; }
  else if (base.startsWith("layer-")) { layer = base.slice(6); html = viewLayer(layer); }
  else if (base.startsWith("slice-")) { const s = D.slices.find(x => slug(x.id) === base.slice(6)); if (s) { layer = s.layer; html = viewLayer(s.layer); after = () => { const el = document.getElementById(base); if (el) el.scrollIntoView(); }; } else html = notFound(); }

  else if (base === "flows") html = viewFlows();

  else if (base === "runtime") { html = viewRuntime(sub); layer = "runtime"; if (sub) after = () => { const el = document.getElementById(sub); if (el) { if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView({ block: "start" }); } }; }
  else if (base === "glossary") { html = viewGlossary(); if (sub) after = () => { const el = document.getElementById(sub); if (el) { el.scrollIntoView({ block: "center" }); el.style.background = "var(--sunk)"; } }; }
  else if (base === "timeline") html = viewTimeline();

function wireFolds(main) {

function wireFilters(main) {

  const keys = $("#cli-keys", main);
  const runCli = rows($("#cli-filter", main), "#cli-table tbody tr", r => !keys || !keys.checked || r.dataset.keys === "1");
  if (keys && runCli) keys.addEventListener("change", runCli);

/* ---------- search ---------- */
const IDX = [];
for (const [p, m] of Object.entries(MOD)) {
  IDX.push({ k: "module", t: m.title, s: p + " · " + m.tagline, h: modHref(p), x: (m.title + " " + p + " " + m.tagline).toLowerCase(), w: 3 });
  for (const it of m.key_items || []) IDX.push({ k: it.kind || "item", t: it.name, s: m.title + " · " + (it.summary || ""), h: modHref(p, it.name), x: (it.name + " " + m.title + " " + (it.summary || "")).toLowerCase(), w: 2 });
  for (const tu of m.tunables || []) IDX.push({ k: "tunable", t: tu.name + " = " + tu.value, s: m.title + " · " + tu.meaning, h: modHref(p), x: (tu.name + " " + tu.meaning).toLowerCase(), w: 1 });
}
for (const s of D.slices) IDX.push({ k: "slice", t: s.title, s: s.tagline, h: "#slice-" + slug(s.id), x: (s.title + " " + s.tagline).toLowerCase(), w: 3 });
for (const L of D.layers) IDX.push({ k: "layer", t: L.title, s: L.blurb, h: "#layer-" + L.id, x: (L.title + " " + L.blurb).toLowerCase(), w: 4 });
for (const f of D.flows || []) IDX.push({ k: "flow", t: f.title, s: f.summary, h: "#flow-" + slug(f.id), x: (f.title + " " + f.summary).toLowerCase(), w: 3 });
for (const g of D.glossary || []) IDX.push({ k: "term", t: g.term, s: g.meaning, h: "#glossary--g-" + slug(g.term), x: (g.term + " " + g.meaning).toLowerCase(), w: 2 });
for (const c of D.cli || []) IDX.push({ k: "command", t: c.command, s: c.summary, h: "#runtime--cli-" + slug(c.command), x: (c.command + " " + c.summary).toLowerCase(), w: 2 });
for (const p of D.processes || []) IDX.push({ k: "process", t: p.name, s: p.summary, h: "#runtime--p-" + slug(p.id), x: (p.name + " " + p.summary).toLowerCase(), w: 3 });
for (const f of D.lab_files || []) IDX.push({ k: "file", t: f.path, s: f.purpose, h: "#runtime--lab-files", x: (f.path + " " + f.purpose).toLowerCase(), w: 1 });
for (const p of SP) IDX.push({ k: "process", t: p.name, s: (p.command || "") + " · " + (p.summary || ""), h: "#overview--sys-diagram", x: (p.name + " " + p.id + " " + (p.command || "") + " " + (p.summary || "")).toLowerCase(), w: 4, focus: p.id });
for (const c of (SYS.channels || {}).channels || []) IDX.push({ k: "channel", t: (c.name || c.id), s: sysName([].concat(c.from)[0]) + " → " + [].concat(c.to).map(sysName).join(", ") + " · " + (c.carries || ""), h: "#overview--channels", x: ((c.name || "") + " " + c.id + " " + c.transport + " " + (c.carries || "")).toLowerCase(), w: 2 });
for (const s of (SYS.sequences || {}).sequences || []) IDX.push({ k: "scenario", t: s.title, s: s.summary, h: "#scenario-" + slug(s.id), x: (s.title + " " + s.summary).toLowerCase(), w: 3 });
const q = $("#q"), res = $("#results"); let sel = 0, hits = [];
function search(text) {
  const words = text.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const out = [];
  for (const e of IDX) {
    if (!words.every(w => e.x.includes(w))) continue;
    const tl = e.t.toLowerCase(); const w0 = words.join(" ");
    const score = (tl === w0 ? 100 : tl.startsWith(w0) ? 50 : tl.includes(w0) ? 25 : 0) + e.w * 5 - Math.min(20, e.t.length / 4);
    out.push([score, e]);
  }
  return out.sort((a, b) => b[0] - a[0]).slice(0, 40).map(x => x[1]);
}
function hl(s, words) { let h = esc(s); for (const w of words) { if (w.length < 2) continue; h = h.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); } return h; }
function showResults() {
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  hits = search(q.value); sel = 0;
  if (!q.value.trim()) { res.hidden = true; return; }
  res.hidden = false;
  res.innerHTML = hits.length ? hits.map((e, i) => `<a href="${e.h}" class="${i === sel ? "sel" : ""}"${e.focus ? ` data-focus="${esc(e.focus)}"` : ""}><div class="t"><span class="k">${esc(e.k)}</span><span>${hl(e.t, words)}</span></div><div class="s">${esc(trimTo(e.s, 110))}</div></a>`).join("") : `<div class="empty small" style="padding:8px">Nothing matches “${esc(q.value)}”.</div>`;
}
q.addEventListener("input", showResults);
q.addEventListener("focus", () => { if (q.value.trim()) showResults(); });
q.addEventListener("keydown", e => {
  const as = $$("a", res);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!as.length) return; sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + as.length) % as.length; as.forEach((a, i) => a.classList.toggle("sel", i === sel)); as[sel].scrollIntoView({ block: "nearest" }); }
  else if (e.key === "Enter") { if (as[sel]) { pickHit(as[sel]); location.hash = as[sel].getAttribute("href").slice(1); res.hidden = true; q.blur(); } }
  else if (e.key === "Escape") { res.hidden = true; q.blur(); }
});
res.addEventListener("click", e => { const a = e.target.closest("a"); if (a) pickHit(a); res.hidden = true; });
function pickHit(a) { if (a.dataset.focus) { sysFocus = a.dataset.focus; if (location.hash === a.getAttribute("href")) route(); } }
document.addEventListener("click", e => { if (!e.target.closest(".search")) res.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== q && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); q.select(); } });
$("#menu-btn").addEventListener("click", () => document.body.classList.toggle("drawer"));
$("#scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
$("#brand-sub").textContent = D.commit ? "at " + D.commit : "";

renderSide();
window.addEventListener("hashchange", route);
route();
})();
