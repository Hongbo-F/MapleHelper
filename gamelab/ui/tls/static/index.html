<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLS Viewer</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">TLS viewer</div>
  <select id="cap" title="Capture (pcap + the keys*.log beside it)"></select>
  <select id="frames" title="How frames over 1500 bytes are treated (tls_decrypt.py --local)">
    <option value="">Frames: auto</option>
    <option value="0">Frames: router rules</option>
    <option value="1">Frames: local, trust big frames</option>
  </select>
  <button type="button" id="reload" title="Decrypt the capture again">&#x21bb; Reload</button>
  <div id="stats" class="stats"></div>
</header>
<nav class="bar">
  <div class="tabs" role="tablist">
    <button type="button" data-view="items" class="on" role="tab">Requests</button>
    <button type="button" data-view="conns" role="tab">Connections</button>
    <button type="button" data-view="csauth" role="tab" title="The NGS anti-cheat's x-csauth calls per computer, each showing what changed">x-csauth</button>
  </div>
  <input id="q" type="search" placeholder="Filter: host, path, method, status, #conn  (-word excludes; / to focus)" autocomplete="off" spellcheck="false">
  <label class="chk" title="Also search headers and decoded bodies (server side)"><input type="checkbox" id="deep"> in bodies</label>
  <select id="host" title="Host"><option value="">All hosts</option></select>
  <span class="toggles" data-for="items">
    <label class="chk"><input type="checkbox" id="t-http" checked> HTTP</label>
    <label class="chk"><input type="checkbox" id="t-ws" checked> WebSocket</label>
    <label class="chk" title="WebSocket ping / pong / close frames"><input type="checkbox" id="t-ctl"> WS control</label>
  </span>
  <span class="toggles" data-for="csauth">
    <label class="chk" title="List every heartbeat, also those with nothing new"><input type="checkbox" id="t-quiet"> quiet heartbeats</label>
  </span>
  <span class="toggles" data-for="conns">
    <label class="chk" title="Also list TLS connections that could not be decrypted"><input type="checkbox" id="t-nokey"> undecrypted</label>
  </span>
  <span id="count" class="count"></span>
</nav>
<main id="main">
  <section id="list" class="list" tabindex="-1"></section>
  <div id="split" class="split" title="Drag to resize"></div>
  <section id="detail" class="detail"><div class="placeholder">Select a request or a connection.</div></section>
</main>
<div id="overlay" class="overlay hidden"><div class="box"><div class="spin"></div><div id="ovmsg">Loading</div></div></div>
<script src="app.js"></script>
</body>
</html>
